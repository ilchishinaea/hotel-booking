spring:
  application:
    name: hotel-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${APP_PORT:8080}

logging:
  level:
    com.example.hotelbooking: DEBUG
